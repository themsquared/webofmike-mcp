[build]
  command = "npm run typecheck"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Do not rewrite /mcp to /.netlify/functions/mcp.
# This is a Functions 2.0 handler with `export const config.path = "/mcp"`.
# A custom path replaces the default URL, so a forced rewrite to
# /.netlify/functions/mcp 404s (that path no longer exists).
